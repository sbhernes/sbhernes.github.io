<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">VCF Automation 9: The Big Picture</title>
<desc id="desc">An All Apps architecture overview showing provider-managed regions and Supervisor clusters to the left; a tenant organization containing two projects, their vSphere namespaces, workloads and VPC networks to the right; and VMware Cloud Foundation beneath both. Dashed arrows indicate region placement, not ownership.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071423"/><stop offset=".65" stop-color="#0b2939"/><stop offset="1" stop-color="#071827"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#114658"/><stop offset="1" stop-color="#103444"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#18553e"/><stop offset="1" stop-color="#267c56"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#74e2d0" stroke-width="1.8"/></marker></defs>
<rect width="1600" height="960" fill="url(#bg)"/>
<path d="M0 880 Q250 792 500 850 T1000 832 T1600 852" stroke="#157a81" stroke-width="3" fill="none" opacity=".4"/>
