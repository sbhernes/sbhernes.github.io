<rect x="64" y="227" width="450" height="514" rx="24" fill="#0d293b" stroke="#2c728c" stroke-width="2"/>
<text x="93" y="274" font-size="29" font-weight="750" fill="#f2fbfc">Regions &amp; infrastructure</text>
