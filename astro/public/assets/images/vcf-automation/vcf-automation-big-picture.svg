<text x="119" y="583" font-size="20" fill="#a1dce8">Production / approved storage</text>
<rect x="119" y="603" width="338" height="44" rx="11" fill="#1c6071"/>
<text x="141" y="631" font-size="20" font-weight="650" fill="#e5fafd">Supervisor cluster(s)</text>
<text x="98" y="706" font-size="18" fill="#8dbccc">Region = available capacity, not tenant ownership</text>
